[package]
name = "turbo-delete"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Fast, parallel folder deletion for Windows that never follows symlinks or junctions"
license = "Apache-2.0"
repository = "https://github.com/Balls0fSteel/b0s-turbo-delete"
readme = "README.md"

[[bin]]
name = "td"
path = "src/main.rs"

[dependencies]
indicatif = { version = "0.18.6", default-features = false }
owo-colors = "4.4.0"
rayon = "1.12.0"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
