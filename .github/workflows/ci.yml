name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml selects stable with rustfmt and clippy.
      - run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

      # Makes a ready-to-use td.exe downloadable from every run's summary page.
      - name: Build release td.exe
        if: runner.os == 'Windows'
        run: cargo build --release --locked
      - name: Upload td.exe
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: td-windows-x64
          path: target/release/td.exe
          if-no-files-found: error

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Keep in sync with `rust-version` in Cargo.toml.
      - run: rustup toolchain install 1.85 --profile minimal --no-self-update
      - run: cargo +1.85 check --all-targets --locked
